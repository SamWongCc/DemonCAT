[demoncat]
state_file = ~/.demoncat/state.json
log_level  = warn

# ============================================================================
# CPU 模块 (2 条)
# ============================================================================

[fault.rCPU_overload]
module          = cpu
desc            = CPU overload (multi-core burn, pure user-space)
script          = src/scripts/cpu/cpu_overload.sh
supported_ops   = inject,clean,query
inject_required = cores
inject_optional = load_pct
clean_required  = cores
query_required  = cores

[fault.rCPU_core_offline]
module          = cpu
desc            = CPU core offline via sysfs
script          = src/scripts/cpu/cpu_core_offline.sh
supported_ops   = inject,clean,query
inject_required = cores
clean_required  = cores
query_required  = cores

